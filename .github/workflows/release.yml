name: release
# Publishes to npm when a version tag is pushed (git tag v0.1.1 && git push --tags).
# Uses npm trusted publishing (OIDC): no npm token is stored in GitHub.
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Tag must match package.json version
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium-headless-shell
      - run: npm publish --access public --provenance
